name: dbt CI

# Every pull request into main gets a full build and test in an isolated schema.
# Nothing merges without passing.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

env:
  DBT_PROFILES_DIR: ./ci
  SNOWFLAKE_ACCOUNT:   ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER:      ${{ secrets.SNOWFLAKE_CI_USER }}
  SNOWFLAKE_PASSWORD:  ${{ secrets.SNOWFLAKE_CI_PASSWORD }}
  SNOWFLAKE_ROLE:      CI_ROLE
  SNOWFLAKE_WAREHOUSE: CI_WH
  SNOWFLAKE_DATABASE:  AIRBNB_CI
  # Isolated schema per pull request
  SNOWFLAKE_SCHEMA:    pr_${{ github.event.pull_request.number }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out the branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt
        run: |
          pip install --upgrade pip
          pip install dbt-core dbt-snowflake sqlfluff sqlfluff-templater-dbt

      - name: Install dbt packages
        run: dbt deps

      - name: Check connection
        run: dbt debug --target ci

      - name: Lint SQL
        run: sqlfluff lint models --dialect snowflake
        continue-on-error: true

      - name: Build and test everything
        run: dbt build --target ci

      - name: Generate docs
        if: always()
        run: dbt docs generate --target ci

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-target-pr-${{ github.event.pull_request.number }}
          path: target/
          retention-days: 7

  cleanup:
    name: Drop the CI schema
    runs-on: ubuntu-latest
    needs: build
    # Runs whether the build passed or failed - no orphaned schemas either way
    if: always()

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt
        run: pip install dbt-core dbt-snowflake

      - name: Drop schema
        run: |
          dbt run-operation drop_ci_schema \
            --args "{schema_name: ${{ env.SNOWFLAKE_SCHEMA }}}" \
            --target ci
